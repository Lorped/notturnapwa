<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar color="medium">
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list [inset]="true">
      <ion-item>
      <ion-toggle [(ngModel)]="paletteToggle" (ionChange)="toggleChange($event)" justify="space-between"
        >Dark Mode</ion-toggle
      >
    </ion-item>
      <ion-item>
        <ion-icon name="people-outline" size="small"></ion-icon>
        <ion-button fill="clear" (click)="openRubrica()">Rubrica</ion-button>
      </ion-item>
      <ion-item>
        <ion-icon name="flash" size="small"></ion-icon>
        <ion-button fill="clear">Background, contatti e alleati</ion-button>
      </ion-item>
      <ion-item>
        <ion-label>The Legend of Zelda</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">

<ion-content>

  <ion-tabs >
    <ion-tab-bar slot="bottom" color="light">

      <ion-tab-button tab="tab1">
        <ion-icon name="person-outline" size="small"></ion-icon>
        <ion-label>Scheda</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab2">
        <ion-icon name="bulb" size="small"></ion-icon>
        <ion-label>Skill</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="tab3">
        <ion-icon name="flash"size="small"></ion-icon>
        <ion-label>Background</ion-label>
      </ion-tab-button>
        
      <ion-tab-button tab="tab5">
        <ion-icon name="keypad-outline" size="small"></ion-icon>
        <ion-label>Poteri</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-tabs>

</ion-content>

</div>

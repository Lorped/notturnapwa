<ion-header>

  <ion-toolbar color="medium">
    <ion-title>Poteri e Messaggi</ion-title>
  </ion-toolbar>

</ion-header>


<ion-content class="master" color="dark" >

  <!--
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)" class="master">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  -->


  <ion-row class="master" color="dark" >
    <ion-col>
      <ion-button class="submit-btn2" expand="full" shape="round" color="danger" type="submit" (click)="tiraildado()">Tira un dado</ion-button>
    </ion-col>
  </ion-row>

  <ion-row class="master" color="dark" >
    <ion-col>
      <ion-button class="submit-btn3" expand="full" shape="round" type="submit" [disabled]="user.fdv==0" (click)="usafdv()">Usa Forza di Volontà</ion-button>
    </ion-col>
  </ion-row>

  <ion-row class="master" color="dark" >
    <ion-col>
      <ion-button id="cura" class="submit-btn2" color="danger" expand="full" shape="round" type="submit" [disabled]="user.PScorrenti==0" (click)="menops()">Cura Ferite - {{this.user.rigen}}</ion-button>
    </ion-col>
  </ion-row>

  <ion-alert
    trigger="cura"
    header="Attenzione"
    subHeader="Cura ferite"
    [buttons]="alertButtons"
  message="{{user.rigen}}  ferite curate" ></ion-alert>



  <ion-row class="master" color="dark" >
    <ion-col>
      <ion-button class="submit-btn2" color="danger" expand="full" shape="round" type="submit" (click)="golegami()">Legame di Sangue</ion-button>
    </ion-col>
  </ion-row>



  <ion-row class="master" color="dark">
    @for (pot of this.userskill.discipline; track pot) {
      <ion-col size="6">
        <ion-button color="danger" (click)="godisciplina(pot.iddisciplina,pot.nomedisc )"  class="submit-btn2" expand="full" shape="round" type="submit" [disabled]="this.user.PScorrenti==0" >{{pot.nomedisc}}</ion-button>
      </ion-col>
    }
  </ion-row>




  <ion-list color="dark" class="master">
    @for (tiri of tiridado; track tiri) {
      <ion-item  color="dark" class="master" >
        <ion-label class="ion-text-wrap" >
          <p style="color: #707070">{{tiri.data}} {{tiri.ora}}</p><div>{{tiri.pg}} {{tiri.testo}} </div>
        </ion-label>
      </ion-item>
    }
  </ion-list>


</ion-content>

<ion-header>

  <ion-toolbar color="medium">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab3"></ion-back-button>
    </ion-buttons>
    <ion-title>jsQRscanner</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content  padding >

  <!--  PER IMMAGINE FISSA -->
  <!--
  <input #fileinput type="file" accept="image/*;capture=camera" hidden (change)="handleFile($event)">
  -->


  <!-- Trigger the file input -->
  <!--
  <ion-button expand="full" (click)="captureImage()">
    <ion-icon slot="start" name="camera"></ion-icon>
    Capture Image
  </ion-button>
  -->

  <ion-button expand="full" (click)="startScan()">
    <ion-icon slot="start" name="qr-scanner"></ion-icon>
    Start scan
  </ion-button>

  @if (scanResult) {
    <ion-button expand="full" (click)="reset()" color="warning">
      <ion-icon slot="start" name="refresh"></ion-icon>
      Reset
    </ion-button>
  }

  <!-- Shows our camera stream -->
  <video #video [hidden]="!scanActive" width="100%"></video>

  <!-- Used to render the camera stream images -->
  <canvas #canvas hidden></canvas>

  <!-- Stop our scanner preview if active -->
  <!--

    </ion-card-header>
    <ion-card-content>
      {{ scanResult }}
    </ion-card-content>
  </ion-card>
